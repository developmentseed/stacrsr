[package]
name = 'stacrsr'
version = '0.1.0'
edition = '2021'

[lib]
crate-type = [ 'staticlib' ]
name = 'stacrsr'

[dependencies]
extendr-api = { version = "0.7.1", features = ["serde"] }
serde = "1.0.217"
stac = { version = "0.12.0", features = ["object-store-all"] }
tokio = { version = "1.43.0", features = ["rt-multi-thread"] }
